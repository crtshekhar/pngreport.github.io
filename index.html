<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MTD Reports</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f4f4;
            color: #333;
            padding: 20px;
        }

        .container {
            display: flex;
            flex-wrap: wrap;
            gap: 20px;
        }

        .frame {
            width: 500px;  /* Set the width to 72px */
            height: 550px;  /* Set the height to 450px */
            padding: 40px;
            background-color: #fff;
            border-radius: 10px;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
            text-align: center;
            display: flex;
            flex-direction: column;
            justify-content: center;  /* Center content vertically */
            align-items: center;  /* Center content horizontally */
        }

        .frame h3 {
            font-size: 14px;  /* Adjust the font size for better fitting */
            color: #4CAF50;
            margin: 0 0 10px 0;  /* Reduce margin to fit better */
        }

        .frame img {
            width: 100%;
            height: auto;
            border-radius: 10px;
            margin-top: 10px;
        }

        .frame button {
            background-color: #4CAF50;
            color: white;
            padding: 10px 20px;
            border: none;
            border-radius: 5px;
            font-size: 16px;
            cursor: pointer;
            margin-top: 15px;
        }

        .frame button:hover {
            background-color: #45a049;
        }
    </style>
</head>
